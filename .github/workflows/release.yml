name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like 'refs/tags/v*') {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "5.1.0.${{ github.run_number }}"
          }
          $file = "Project Files/Source/Console/AssemblyInfo.cs"
          $content = Get-Content $file -Raw
          $content = $content -replace 'AssemblyVersion\(".*?"\)', "AssemblyVersion(`"$version`")"
          $content = $content -replace 'AssemblyFileVersion\(".*?"\)', "AssemblyFileVersion(`"$version`")"
          Set-Content $file $content -NoNewline
          Write-Host "Version set to $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX v3
        run: choco install wixtoolset --yes --no-progress

      - name: Restore NuGet packages
        run: msbuild "Project Files/Source/Console/Thetis.csproj" -t:Restore -p:Configuration=Release -p:Platform=x64 -m -nologo

      - name: Build Thetis
        run: msbuild "Project Files/Source/Console/Thetis.csproj" -p:Configuration=Release -p:Platform=x64 -m -nologo

      - name: Stage native prebuilt binaries
        shell: pwsh
        run: |
          $dest = "Project Files/bin/x64/Release"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "Project Files/lib/prebuilt-x64/*" $dest -Force
          Get-ChildItem $dest -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Build MSI installer
        run: |
          $wixTargets = "C:/Program Files (x86)/MSBuild/Microsoft/WiX/v3.x/Wix.targets"
          msbuild "Project Files/Source/Thetis-Installer/Thetis-Installer.wixproj" -p:Configuration=Release -p:Platform=x64 "-p:WixTargetsPath=$wixTargets" -m -nologo

      - name: Download .NET 10 Desktop Runtime for bundling
        shell: pwsh
        run: |
          $url = "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/10.0.11/windowsdesktop-runtime-10.0.11-win-x64.exe"
          $dest = "Project Files/Source/Thetis-Installer/redist/windowsdesktop-runtime-10.0.11-win-x64.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
          Get-Item $dest | Select-Object FullName, Length

      - name: Build self-contained Windows setup.exe
        run: |
          $wixTargets = "C:/Program Files (x86)/MSBuild/Microsoft/WiX/v3.x/Wix.targets"
          msbuild "Project Files/Source/Thetis-Installer/Thetis-Bundle.wixproj" -p:Configuration=Release -p:Platform=x64 "-p:WixTargetsPath=$wixTargets" -m -nologo

      - name: Find installer artifacts
        id: msi
        shell: pwsh
        run: |
          $exe = Get-ChildItem "Project Files/bin/Installers/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msiFile = Get-ChildItem "Project Files/bin/Installers/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe -or -not $msiFile) {
            Get-ChildItem "Project Files/bin/Installers" -ErrorAction SilentlyContinue | Format-Table Name, Length
            Write-Error "Installer exe or msi not found"
            exit 1
          }
          "exe=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "msi=$($msiFile.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Thetis-VK-amp-control-windows-installer
          path: |
            Project Files/bin/Installers/*.exe
            Project Files/bin/Installers/*.msi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.msi.outputs.exe }}
            ${{ steps.msi.outputs.msi }}
          body: |
            ## Windows installer

            - **`.exe` (recommended)** — installs .NET 10 Desktop Runtime if needed, then Thetis VK amp control (SDR-VST3) into Program Files.
            - **`.msi`** — product only; requires .NET 10 Desktop Runtime already installed.

            After install, use the **Thetis VK amp control** desktop shortcut. Power the radio before starting Helios DX.
          generate_release_notes: true
